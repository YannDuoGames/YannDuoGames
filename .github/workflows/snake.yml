# Génère le « serpent » qui mange les contributions — mis à jour chaque nuit.
# Gratuit, zéro maintenance : c'est l'Action open-source Platane/snk.
name: Serpent de contributions

on:
  schedule:
    - cron: "17 5 * * *"   # chaque nuit à 05h17 UTC (heure creuse, pas d'heure pile)
  workflow_dispatch:        # + déclenchable à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Générer les SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
